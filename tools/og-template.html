<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>OG Template — 1200x630</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;800;900&family=JetBrains+Mono:wght@400;500;700&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #1a1a1a;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    font-family: 'Inter', system-ui, sans-serif;
  }

  .card {
    width: 1200px;
    height: 630px;
    background: #0a0a0a;
    position: relative;
    overflow: hidden;
    display: grid;
    grid-template-columns: 1fr 380px;
    color: #e8e8e8;
  }

  /* Gradientes de fondo */
  .card::before {
    content: '';
    position: absolute;
    inset: 0;
    background:
      radial-gradient(circle at 10% 20%, rgba(255, 0, 64, 0.12) 0%, transparent 45%),
      radial-gradient(circle at 90% 80%, rgba(0, 255, 136, 0.10) 0%, transparent 45%),
      radial-gradient(circle at 50% 50%, rgba(255, 215, 0, 0.04) 0%, transparent 60%);
    pointer-events: none;
  }

  /* Grid sutil de fondo */
  .card::after {
    content: '';
    position: absolute;
    inset: 0;
    background-image:
      linear-gradient(rgba(255,255,255,0.02) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.02) 1px, transparent 1px);
    background-size: 40px 40px;
    pointer-events: none;
  }

  .content {
    position: relative;
    z-index: 1;
    padding: 64px 48px 56px 64px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
  }

  /* Badge VERIFIED */
  .badge {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    align-self: flex-start;
    padding: 8px 18px;
    border: 1.5px solid #00FF88;
    border-radius: 50px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 0.18em;
    color: #00FF88;
  }
  .badge::before {
    content: '';
    width: 7px;
    height: 7px;
    background: #00FF88;
    border-radius: 50%;
    box-shadow: 0 0 8px #00FF88;
  }

  /* Título */
  .title {
    font-size: 58px;
    line-height: 1.05;
    font-weight: 900;
    letter-spacing: -0.03em;
    margin-top: 24px;
    margin-bottom: 20px;
  }
  .title .line {
    display: block;
  }
  .title .accent {
    background: linear-gradient(90deg, #FFD700 0%, #00FF88 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  .subtitle {
    font-size: 18px;
    line-height: 1.55;
    color: #8a8a8a;
    max-width: 560px;
    margin-bottom: 28px;
  }

  /* Meta grid */
  .meta {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 16px;
    padding-top: 24px;
    border-top: 1px solid #262626;
  }
  .meta-item {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .meta-label {
    font-size: 10px;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: #8a8a8a;
    font-weight: 600;
  }
  .meta-value {
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
    font-weight: 500;
  }
  .meta-value.green { color: #00FF88; }
  .meta-value.gold { color: #FFD700; }

  /* Panel derecho con logo */
  .logo-panel {
    position: relative;
    z-index: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 48px 48px 48px 0;
  }

  .logo-wrapper {
    position: relative;
    width: 280px;
    height: 280px;
  }

  /* Anillos pulsantes detrás del logo */
  .ring {
    position: absolute;
    inset: 0;
    border-radius: 50%;
    border: 1.5px solid;
    animation: pulse 4s ease-in-out infinite;
  }
  .ring-1 { border-color: rgba(0, 255, 136, 0.5); animation-delay: 0s; }
  .ring-2 { border-color: rgba(255, 215, 0, 0.4); inset: 20px; animation-delay: 0.7s; }
  .ring-3 { border-color: rgba(255, 0, 64, 0.35); inset: 40px; animation-delay: 1.4s; }

  @keyframes pulse {
    0%, 100% { transform: scale(1); opacity: 0.8; }
    50% { transform: scale(1.05); opacity: 0.4; }
  }

  .logo-svg {
    position: absolute;
    inset: 60px;
    z-index: 2;
  }

  /* Watermark Acta */
  .watermark {
    position: absolute;
    bottom: 24px;
    right: 32px;
    z-index: 1;
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: #3a3a3a;
    letter-spacing: 0.1em;
  }
</style>
</head>
<body>
  <div class="card">
    <div class="content">
      <div>
        <span class="badge">VERIFIED</span>
        <h1 class="title">
          <span class="line">Co-Creatividad</span>
          <span class="line accent">Simbiótica</span>
          <span class="line">&amp; Respeto Digital</span>
        </h1>
        <p class="subtitle">
          KRONOS verifica autenticidad vocal con ancla cimática de 440 Hz,
          consentimiento explícito y auditoría NOM-151.
        </p>
      </div>

      <div class="meta">
        <div class="meta-item">
          <span class="meta-label">Acta</span>
          <span class="meta-value green">2607086319439</span>
        </div>
        <div class="meta-item">
          <span class="meta-label">SHA-256</span>
          <span class="meta-value green">41a3683b…f4c3</span>
        </div>
        <div class="meta-item">
          <span class="meta-label">Blockchain</span>
          <span class="meta-value gold">Ethereum</span>
        </div>
      </div>
    </div>

    <div class="logo-panel">
      <div class="logo-wrapper">
        <div class="ring ring-1"></div>
        <div class="ring ring-2"></div>
        <div class="ring ring-3"></div>
        <svg class="logo-svg" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
          <circle cx="32" cy="32" r="32" fill="#0a0a0a"/>
          <circle cx="32" cy="32" r="29" fill="none" stroke="#00FF88" stroke-width="1.5" opacity="0.9"/>
          <circle cx="32" cy="32" r="22" fill="none" stroke="#FFD700" stroke-width="1.2" opacity="0.7"/>
          <circle cx="32" cy="32" r="15" fill="none" stroke="#FF0040" stroke-width="1" opacity="0.55"/>
          <circle cx="32" cy="3" r="1.2" fill="#00FF88"/>
          <circle cx="32" cy="61" r="1.2" fill="#00FF88"/>
          <circle cx="3" cy="32" r="1.2" fill="#00FF88"/>
          <circle cx="61" cy="32" r="1.2" fill="#00FF88"/>
          <path d="M 6 32 Q 12.5 16, 19 32 Q 25.5 48, 32 32 Q 38.5 16, 45 32 Q 51.5 48, 58 32"
                fill="none" stroke="#FFD700" stroke-width="1.8" stroke-linecap="round"/>
          <circle cx="32" cy="32" r="2.5" fill="#FF0040"/>
          <circle cx="32" cy="32" r="1" fill="#0a0a0a"/>
        </svg>
      </div>
    </div>

    <div class="watermark">ACTA 2607086319439 · 2026</div>
  </div>
</body>
</html>
