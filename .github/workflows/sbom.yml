name: 📦 SBOM

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sbom:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile
      - name: Generate SBOM (placeholder)
        run: |
          cat > sbom.json << 'EOF'
          {
            "bomFormat": "CycloneDX",
            "specVersion": "1.5",
            "version": 1,
            "metadata": {
              "component": {
                "name": "movimiento-co-creatividad-simbiotica",
                "version": "0.3.0",
                "description": "Movimiento de Co-Creatividad Simbiótica y Respeto Digital — KRONOS"
              },
              "timestamp": "2026-09-11T00:00:00Z"
            },
            "components": []
          }
          EOF
          echo "✅ SBOM placeholder generado"
          cat sbom.json
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.json
